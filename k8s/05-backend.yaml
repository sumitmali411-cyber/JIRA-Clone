apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-clone-backend
  namespace: jira-clone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jira-clone-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime deploys
  template:
    metadata:
      labels:
        app: jira-clone-backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z keycloak 8080; do
                echo "Waiting for Keycloak...";
                sleep 5;
              done
      containers:
        - name: jira-clone-backend
          image: jira-clone-backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          command:
            - java
            - -jar
            - app.jar
            - --spring.config.location=/app/config/application.properties
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: db-password
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: webhook-secret
          volumeMounts:
            - name: backend-config
              mountPath: /app/config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backend-config
          configMap:
            name: backend-config

---

apiVersion: v1
kind: Service
metadata:
  name: jira-clone-backend
  namespace: jira-clone
spec:
  selector:
    app: jira-clone-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jira-clone-backend-hpa
  namespace: jira-clone
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jira-clone-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
