server.port=8080
spring.application.name=jira-clone-backend

# MySQL DataSource
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/jiraclone?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Jackson - compact JSON
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/jira-clone}

# GitHub Webhook
# No default. A published fallback lets anyone who reads this repo forge
# signed webhook deliveries. Generate with: openssl rand -hex 32
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}

# Logging
logging.level.com.jiraclone=INFO

# Do not leak stack traces or internal messages to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Swagger / OpenAPI. Disable on deployed environments: the UI and the api-docs
# endpoint are permitAll and publish the whole API surface.
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Origin allowed to call this API.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
