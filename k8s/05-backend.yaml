apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-clone-backend
  namespace: jira-clone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jira-clone-backend
  template:
    metadata:
      labels:
        app: jira-clone-backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "Waiting for MySQL...";
                sleep 3;
              done
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z keycloak 8080; do
                echo "Waiting for Keycloak...";
                sleep 5;
              done
      containers:
        - name: jira-clone-backend
          image: jira-clone-backend:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          command:
            - java
            - -jar
            - app.jar
            - --spring.config.location=/app/config/application.properties
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: db-password
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: webhook-secret
          volumeMounts:
            - name: backend-config
              mountPath: /app/config
      volumes:
        - name: backend-config
          configMap:
            name: backend-config

---

apiVersion: v1
kind: Service
metadata:
  name: jira-clone-backend
  namespace: jira-clone
spec:
  selector:
    app: jira-clone-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
